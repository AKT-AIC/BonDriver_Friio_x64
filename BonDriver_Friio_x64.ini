; ======================================================================
; BonDriver_Friio_x64 Ver.1.0
; White Friio / Terrestrial Digital TV
; ======================================================================
; 1 = Enable / 0 = Disable
; 通常使用では変更しないでください。Ver.1.0の標準構成はすべて1です。
; 開発中の6個のARMファイルをこの設定ファイルへ統合しました。
; 設定ファイル/項目が無い場合は成功基準維持のため1(有効)として扱います。

[WhiteFriio]
; 白Friio確認処理。旧: DRAFT10_ENABLE_WHITE_PROBE.txt
EnableWhiteProbe=1

; 白Friio用初期化全体の親スイッチ。旧: DRAFT10_ENABLE_WHITE_INIT.txt
; 0の場合は初期化処理全体を実行しません。
EnableWhiteInit=1

; Probe後、PRECONTROL前の3件処理。3.1/3.2解析から復元。
; 旧: DRAFT11_ENABLE_SHIRO_POST_PROBE_3.txt
EnableShiroPostProbe3=1

; PRECONTROL 70転送。3.1/3.2双方で確認された初期化経路。
; 既初期化状態でOFFでも視聴できた試験は、初期接続時の不要性を意味しません。
; 旧: DRAFT11_ENABLE_PRECONTROL.txt
EnablePrecontrol=1

; 白Friio 34件レジスタ初期化。BonSDKおよび3.1/3.2で確認された経路。
; 既初期化状態でOFFでも視聴できた結果だけを根拠に削除せず標準ONとします。
; 旧: DRAFT11_ENABLE_WHITE_INIT_34.txt
EnableWhiteInit34=1

[TransportStream]
; 実TS受信経路。48,128 byteの実TSをアプリケーションへ渡します。
; 旧: DRAFT10_ENABLE_REAL_TS.txt
EnableRealTS=1


[Log]
; ----------------------------------------------------------------------
; ログ出力レベル
; ----------------------------------------------------------------------
; 0 = OFF    : ログを出力しません。
; 1 = NORMAL : 通常使用向け。主要な初期化・選局・TS動作とエラーを記録します。
; 2 = DEBUG  : 開発・解析向け。Ver.1.0開発中に使用した詳細なUSB制御、
;              初期化シーケンス、TS受信、信号値等の情報も記録します。
;
; 通常値: 1
; 未指定・不正値は1、範囲外は0..2へ丸めます。
LogLevel=1
